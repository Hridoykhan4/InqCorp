services:
  backend:
    build:
      context: ./Anher-Backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - PORT=5000
      - MongoDB_URL=${MongoDB_URL}
      - URLS=${URLS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - cloud_name=${cloud_name}
      - api_key=${api_key}
      - api_secret=${api_secret}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./Anher-Frontend
      dockerfile: Dockerfile
    environment:
      - BACKEND_UPSTREAM=http://backend:5000
      - VITE_BACKEND_URL=
      - VITE_SITE_URL=${VITE_SITE_URL:-https://inqilabtradingcorporation.com.bd}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
